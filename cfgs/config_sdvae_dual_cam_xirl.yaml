defaults:
  - _self_
  - task@_global_: fruit_gym_single
  - agent@_global_: mentor_states_pretrained
  - override hydra/launcher: submitit_local

# task settings
frame_stack: 3
action_repeat: 1
discount: 0.99
max_episode_steps: 100
# train settings
num_seed_frames: 4000
update_every_steps: 2
# eval
eval_every_frames: 10000
num_eval_episodes: 10
# snapshot
save_model: true
save_buffer: true
# wandb
use_wandb: true
# replay buffer
replay_buffer_size: 650000
replay_buffer_num_workers: 4
nstep: 3
batch_size: 256
# misc
seed: 0
device: cuda
save_video: true
save_train_video: false
use_tb: true
# experiment
experiment: exp
# agent
lr: 1e-4
feature_dim: 50
utd: 1
# resolutions
aug_res: 112
state_res: 112
video_res: 224
# Augmentations
augment: true
# XIRL
use_delta_rewards: true
reward_res: 84
goal_emb_path: /home/emlyn/rl_franka/reward_models/gcr_pull_anchors_tri_mine_2/goal_emb.pkl
distance_scale_path: /home/emlyn/rl_franka/reward_models/gcr_pull_anchors_tri_mine_2/distance_scale.pkl
ckpt_path: /home/emlyn/rl_franka/reward_models/gcr_pull_anchors_tri_mine_2/2200.ckpt


hydra:
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S}_${hydra.job.override_dirname}
  sweep:
    dir: ./exp/${now:%Y.%m.%d}/${now:%H%M}_${agent_cfg.experiment}
    subdir: ${hydra.job.num}
  launcher:
    timeout_min: 4300
    cpus_per_task: 10
    gpus_per_node: 1
    tasks_per_node: 1
    mem_gb: 160
    nodes: 1
    submitit_folder: ./exp/${now:%Y.%m.%d}/${now:%H%M%S}_${agent_cfg.experiment}/.slurm
